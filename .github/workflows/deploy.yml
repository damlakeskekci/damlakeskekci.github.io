name: Deploy website to GitHub Pages

env:
  NODE_VERSION: '22'

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Get Hugo Version
      id: hugo-version
      run: |
        VERSION=$(grep "hugo_version" hugoblox.yaml | awk '{print $2}' | tr -d "'\"")
        echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        # Install the Tailwind CSS CLI with npm (exact versions from package-lock.json).
        # Hugo >= 0.164 only runs tailwindcss if node_modules/.bin/tailwindcss is a Node.js
        # script; npm links the real script, while pnpm creates a shell wrapper Hugo rejects.
        if [ -f "package.json" ]; then
          echo "Installing Tailwind dependencies..."
          npm ci --no-audit --no-fund
        fi

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

      # Cache Hugo's module cache. node_modules is deliberately not cached: it is installed
      # fresh above, and restoring an old copy here would overwrite it.
    - uses: actions/cache@v4
      with:
        path: |
          /tmp/hugo_cache_runner/
        key: ${{ runner.os }}-hugo-deps-v2-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-hugo-deps-v2-

      # Cache Hugo resources (processed images, CSS) - invalidates only when assets/config change
    - uses: actions/cache@v4
      with:
        path: resources/
        key: ${{ runner.os }}-hugo-resources-v2-${{ hashFiles('assets/**/*', 'config/**/*',
          'hugo.yaml', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-hugo-resources-v2-

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

    - name: Generate Pagefind search index (if applicable)
      run: |
        # Check if site uses Pagefind search
        if [ -f "package.json" ] && grep -q "pagefind" package.json; then
          pnpm dlx pagefind --source "public" || npx pagefind --source "public"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

role: Soziologin
bio: |
  Ich habe vor Kurzem meine Promotion in Politikwissenschaft und Soziologie an der Scuola Normale Superiore in Florenz abgeschlossen. Davor habe ich zwei Masterstudiengänge an der Freien Universität Berlin (Soziologie – Europäische Gesellschaften) und an der Humboldt-Universität zu Berlin (MA Research Training Program in Social Sciences) absolviert und meinen Bachelor in Soziologie mit Nebenfach Politikwissenschaft und Öffentliche Verwaltung an der Hacettepe-Universität in Ankara erworben. Forschungsaufenthalte führten mich an die Humboldt-Universität zu Berlin, das WZB Berlin Social Science Center, die Universität Göteborg, das DeZIM-Institut und die Universität Bremen.

